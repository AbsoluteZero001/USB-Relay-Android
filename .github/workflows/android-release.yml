name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail

          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"

          curl -fsSL \
            "https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip" \
            -o "$RUNNER_TEMP/android-commandlinetools.zip"

          rm -rf "$RUNNER_TEMP/android-commandlinetools"
          mkdir -p "$RUNNER_TEMP/android-commandlinetools"

          unzip -q \
            "$RUNNER_TEMP/android-commandlinetools.zip" \
            -d "$RUNNER_TEMP/android-commandlinetools"

          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          mv \
            "$RUNNER_TEMP/android-commandlinetools/cmdline-tools/"* \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" --licenses > /dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Validate Android SDK
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"

          test -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$ANDROID_SDK_ROOT/platform-tools/adb"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"

          sdkmanager --version
          adb --version
          apksigner version

      - name: Validate tag and package version
        if: github.event_name == 'push'
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail

          package_version="$(node -p "require('./frontend/package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"

          echo "Package version: $package_version"
          echo "Tag version:     $tag_version"

          if [ "$package_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match frontend/package.json version $package_version"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build Web and Electron bundles
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Restore Android signing files
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          missing=0

          for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/release.keystore"

          test -s "$RUNNER_TEMP/release.keystore"

          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/release.keystore"
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > android/keystore.properties

          chmod 600 android/keystore.properties

      - name: Build signed release APK
        working-directory: frontend/android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Verify signature and prepare release files
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail

          source_apk="frontend/android/app/build/outputs/apk/release/app-release.apk"

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            release_apk="USB-Relay-Android-${GITHUB_REF_NAME}.apk"
          else
            package_version="$(node -p "require('./frontend/package.json').version")"
            release_apk="USB-Relay-Android-v${package_version}-test.apk"
          fi

          if [ ! -f "$source_apk" ]; then
            echo "::error::Release APK was not generated: $source_apk"
            exit 1
          fi

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$sdk_root" ]; then
            echo "::error::Android SDK root is not configured"
            exit 1
          fi

          apksigner_path="$sdk_root/build-tools/35.0.0/apksigner"

          if [ ! -x "$apksigner_path" ]; then
            echo "::error::apksigner was not found: $apksigner_path"
            exit 1
          fi

          "$apksigner_path" verify \
            --verbose \
            --print-certs \
            "$source_apk"

          cp "$source_apk" "$release_apk"

          sha256sum "$release_apk" > SHA256SUMS.txt

          echo "Release APK:"
          ls -lh "$release_apk"

          echo "SHA-256:"
          cat SHA256SUMS.txt

      - name: Upload test APK artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v5
        with:
          name: USB-Relay-Android-test
          path: |
            USB-Relay-Android-v*-test.apk
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          name: USB Relay Android ${{ github.ref_name }}
          files: |
            USB-Relay-Android-${{ github.ref_name }}.apk
            SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: false
