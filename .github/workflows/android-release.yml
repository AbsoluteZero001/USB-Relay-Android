name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"


      - name: Install Android SDK packages
        working-directory: .
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Validate tag and package version
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./frontend/package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$package_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match frontend/package.json version $package_version"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build Web and Electron bundles
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Restore Android signing files
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          missing=0
          for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"

          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/release.keystore"
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > android/keystore.properties
          chmod 600 android/keystore.properties

      - name: Build signed release APK
        working-directory: frontend/android
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify signature and prepare release files
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          source_apk="frontend/android/app/build/outputs/apk/release/app-release.apk"
          release_apk="USB-Relay-Android-${GITHUB_REF_NAME}.apk"

          test -f "$source_apk"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$sdk_root" ]; then
            echo "::error::Android SDK root is not configured"
            exit 1
          fi
          "${sdk_root}/build-tools/35.0.0/apksigner" verify --verbose "$source_apk"
          cp "$source_apk" "$release_apk"
          sha256sum "$release_apk" > SHA256SUMS.txt

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: USB Relay Android ${{ github.ref_name }}
          files: |
            USB-Relay-Android-${{ github.ref_name }}.apk
            SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: true
